<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cài đặt hệ thống - FB Manager AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <h2>Cài đặt hệ thống</h2>
        <hr>
        {% if request.query_params.get('saved') %}
            <div class="alert alert-success">Đã lưu cấu hình thành công!</div>
        {% endif %}
        <form method="POST" action="/settings">
            <div class="mb-3">
                <label class="form-label">Gemini API Key</label>
                <input type="password" class="form-control" name="gemini_api_key" value="{{ gemini_api_key }}" placeholder="Nhập API Key của bạn vào đây..." required>
                <div class="form-text">Key sẽ được lưu bảo mật vào file .env cục bộ.</div>
            </div>
            <button type="submit" class="btn btn-primary">Lưu Cài Đặt</button>
            <a href="/" class="btn btn-secondary">Quay lại Dashboard</a>
        </form>
    </div>
</body>
</html>

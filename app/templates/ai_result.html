<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Gen Content - Bất Động Sản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="card shadow mb-4">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h4 class="mb-0">Kết quả AI cho: {{ listing.title }}</h4>
                <a href="/listings" class="btn btn-light btn-sm">Quay lại danh sách</a>
            </div>
            <div class="card-body">
                <!-- Nội dung Marketplace -->
                <form action="/listings/{{ listing.id }}/update-from-ai" method="POST" class="mb-4">
                    <label class="form-label fw-bold text-success">🛒 Nội dung đăng Marketplace:</label>
                    <textarea name="description" id="marketText" class="form-control" rows="8">{{ ai_content.marketplace_desc if ai_content is mapping else ai_content }}</textarea>
                    <div class="mt-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm">💾 Lưu nội dung này vào bài đăng</button>
                        <button type="button" class="btn btn-outline-success btn-sm" onclick="copyText('marketText')">📋 Sao chép</button>
                    </div>
                </form>

                <hr>

                <!-- Nội dung Nhóm Group -->
                <form action="/listings/{{ listing.id }}/update-from-ai" method="POST" class="mb-3">
                    <label class="form-label fw-bold text-info">👥 Nội dung đăng Nhóm (Group):</label>
                    <textarea name="description" id="groupText" class="form-control" rows="10">{{ ai_content.group_content if ai_content is mapping else '' }}</textarea>
                    <div class="mt-2 d-flex gap-2">
                        <button type="submit" class="btn btn-info btn-sm text-white">💾 Lưu nội dung này vào bài đăng</button>
                        <button type="button" class="btn btn-outline-info btn-sm" onclick="copyText('groupText')">📋 Sao chép</button>
                    </div>
                </form>

                <div class="mt-3">
                    <a href="/listings" class="btn btn-secondary">Trở về danh sách</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function copyText(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand('copy');
            alert('Đã sao chép nội dung thành công!');
        }
    </script>
</body>
</html>
